# ---------------------------------------------------------------------------
# Experiment / run defaults. CLI flags override these per run.
# ---------------------------------------------------------------------------

# Which environment / scenario this experiment assesses. Recorded in every
# run manifest so results can be grouped by scenario.
scenario_id: grficsv3-baseline

# The assessment objective handed to the agent (recorded with every run so
# model comparisons use identical objectives).
objective: >-
  Assess the security posture of the Docker environment hosting a
  containerized industrial control system (ICS) lab. Identify container
  misconfigurations, risky network exposure, missing resource limits, and
  known image vulnerabilities. Prioritise risks by their impact on an OT
  environment and give concrete, evidence-based remediation for defenders.

# Model profile used when --model is not given (see config/models.yaml).
default_model: local-qwen

scan:
  enabled: true
  # used = only images referenced by containers; all = every local image.
  scope: used
  # Stop after this many images (0 = no limit). Large ICS images can take a
  # few minutes each on the first scan.
  max_images: 0
  severities: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
  # Page size when pulling findings out of trivy-mcp.
  page_size: 500

network_scan:
  enabled: true
  # ICS-safe timing: T2 (polite). Use T3 for IT-only labs with no real PLCs.
  timing: T2
  # Hard timeout per subnet (seconds). Increase for large or slow ICS subnets.
  timeout_per_subnet_seconds: 300
  # Run ICS protocol discovery scripts (modbus-discover, s7-info, enip-info, etc.)
  run_ics_scripts: true
  # Only scan subnets with prefix >= this (24 = /24 max = 256 hosts).
  min_prefix_length: 24

# Paths are relative to the project root.
data_dir: data
output_dir: outputs
